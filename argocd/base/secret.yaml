---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secret
  namespace: event-manager
spec:
  encryptedData:
    BETTER_AUTH_SECRET: 
    BETTER_AUTH_URL: 
    DATABASE_URL: 
    UNIQUE_CLIENT_ID: 
    UNIQUE_CLIENT_SECRET: 
  template:
    metadata:
      name: app-secret
      namespace: event-manager
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: event-manager
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: postgres-secret
      namespace: event-manager
    type: Opaque
