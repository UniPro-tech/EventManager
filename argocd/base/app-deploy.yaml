apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: registry.uniproject.jp/infra/event-manager:0.1.4
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: app-secret
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              value: Asia/Tokyo
      imagePullSecrets:
        - name: internal-harbor
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
